name: E2E Smoke Test (Docker Compose)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '*' ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and start services (detached)
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
        run: |
          docker compose up --build -d db app worker
      - name: Record baseline metric
        run: |
          # wait up to 30s for metrics to appear on localhost:8000
          timeout=30
          start=$(date +%s)
          while [ $(($(date +%s)-start)) -lt $timeout ]; do
            if curl -sS http://localhost:8000/ | grep -q '^sbl_jobs_processed_total'; then
              break
            fi
            sleep 1
          done
          BASE=$(curl -sS http://localhost:8000/ | grep '^sbl_jobs_processed_total' | tail -n1 | awk '{print $2}' || echo 0)
          if [ -z "$BASE" ]; then BASE=0; fi
          echo "JOBS_BASELINE=$BASE" >> $GITHUB_ENV
          echo "Baseline jobs_processed_total=$BASE"

      - name: Run E2E test (one-off container)
        run: |
          set -o pipefail
          docker compose run --rm e2e

      - name: Check metric increment
        run: |
          AFTER=$(curl -sS http://localhost:8000/ | grep '^sbl_jobs_processed_total' | tail -n1 | awk '{print $2}' || echo 0)
          if [ -z "$AFTER" ]; then AFTER=0; fi
          echo "After run: $AFTER";
          echo "Baseline (from env): $JOBS_BASELINE";
          awk -v a=$AFTER -v b=$JOBS_BASELINE 'BEGIN{if(a+0 > b+0) exit 0; else exit 1}' || (echo 'sbl_jobs_processed_total did not increase after E2E run' && docker compose logs worker --no-color --tail=200 && exit 1)

      - name: Tear down compose
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Show compose logs (for debugging)
        if: failure()
        run: docker compose logs --no-color --tail=500
